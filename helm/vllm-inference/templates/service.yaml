apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm-inference.fullname" . }}
  labels:
    {{- include "vllm-inference.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.server.containerPortName }}
      protocol: TCP
      name: {{ .Values.server.containerPortName }}
  selector:
    {{- include "vllm-inference.selectorLabels" . | nindent 4 }}
